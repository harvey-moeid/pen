name: Verify Penalty Battle

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A new push must not interrupt an in-flight production deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated Cloudflare types
        run: |
          npm run cf:types
          git diff --exit-code -- worker-configuration.d.ts
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint source and tests
        run: npm run lint

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test game engine, adapter, and Worker runtime
        run: npm test -- --reporter=default --reporter=junit --outputFile=artifacts/tests/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests/
          retention-days: 14
          if-no-files-found: warn

  browser:
    name: Build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Validate Worker bundle without deploying
        run: npx --no-install wrangler deploy --dry-run
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Test studio, overlay, and admin in Chromium
        run: npm run test:browser
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
      - name: Save the tested production assets
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  ci:
    name: CI passed
    if: always()
    needs: [quality, tests, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          {
            echo '## Penalty Battle CI'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Code quality | $QUALITY_RESULT |"
            echo "| Unit and integration tests | $TESTS_RESULT |"
            echo "| Build and browser tests | $BROWSER_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$QUALITY_RESULT" != success || "$TESTS_RESULT" != success || "$BROWSER_RESULT" != success ]]; then
            echo '::error::All verification jobs must succeed.'
            exit 1
          fi

  deploy:
    name: Deploy production
    needs: ci
    if: >-
      needs.ci.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://penalty-battle-3d.harveymoeid.workers.dev
    concurrency:
      group: penalty-battle-production
      cancel-in-progress: false
    env:
      PRODUCTION_URL: https://penalty-battle-3d.harveymoeid.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo '::error::This commit is no longer main. Run the workflow on the latest main commit.'
            exit 1
          fi
      - name: Check production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const required = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'ADMIN_SECRET', 'WEBHOOK_SIGNING_SECRET'];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) throw new Error(`Add GitHub Actions secrets: ${missing.join(', ')}. See docs/OPERATIONS.md.`);
          if (process.env.CLOUDFLARE_ACCOUNT_ID !== '07086b4d368d0a37ebcbbf186e51eecf') {
            throw new Error('CLOUDFLARE_ACCOUNT_ID must match the account owning the configured KV and R2 resources.');
          }
          for (const name of ['ADMIN_SECRET', 'WEBHOOK_SIGNING_SECRET']) {
            if (process.env[name].length < 32 || process.env[name].length > 512) {
              throw new Error(`${name} must contain 32–512 characters.`);
            }
          }
          if (process.env.ADMIN_SECRET === process.env.WEBHOOK_SIGNING_SECRET) {
            throw new Error('ADMIN_SECRET and WEBHOOK_SIGNING_SECRET must be different.');
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download production assets from this CI run
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: dist/
      - name: Deploy Worker and tested assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
        run: |
          secret_file=$(mktemp "$RUNNER_TEMP/penalty-secrets.XXXXXX.json")
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module - "$secret_file" <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.argv[2], JSON.stringify({
            ADMIN_SECRET: process.env.ADMIN_SECRET,
            WEBHOOK_SIGNING_SECRET: process.env.WEBHOOK_SIGNING_SECRET,
          }), { mode: 0o600 });
          NODE
          unset ADMIN_SECRET WEBHOOK_SIGNING_SECRET
          npx --no-install wrangler deploy --secrets-file "$secret_file" --message "GitHub commit $GITHUB_SHA"
      - name: Smoke test production
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 5 --max-time 15 \
            "$PRODUCTION_URL/api/health" --output "$RUNNER_TEMP/penalty-health.json"
          jq --exit-status '.ok == true and .service == "penalty-battle"' "$RUNNER_TEMP/penalty-health.json"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 5 --max-time 15 \
            "$PRODUCTION_URL/api/snapshot" --output "$RUNNER_TEMP/penalty-snapshot.json"
          jq --exit-status 'has("scores") and has("clubs")' "$RUNNER_TEMP/penalty-snapshot.json"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 5 --max-time 15 \
            "$PRODUCTION_URL/live" --output "$RUNNER_TEMP/penalty-live.html"
          grep -q 'id="root"' "$RUNNER_TEMP/penalty-live.html"
      - name: Record deployment result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Production deployment'
            echo
            echo "Status: $DEPLOY_STATUS"
            echo "Commit: $GITHUB_SHA"
            echo "URL: $PRODUCTION_URL"
            echo
            echo 'A failed smoke test does not roll back code or storage automatically. See docs/OPERATIONS.md.'
          } >> "$GITHUB_STEP_SUMMARY"
